name: Build QuickToggle IPA & DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build QuickToggle Application
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide/Rootless)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build Application
        run: |
          make clean all FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          
      - name: Package IPA with Icons and Info.plist
        run: |
          mkdir -p Payload
          APP_PATH=$(find .theos/ -name "QuickToggle.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: QuickToggle.app not found!"
            find .theos -maxdepth 4
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Ensure Info.plist and icons are inside Payload/QuickToggle.app
          cp Resources/Info.plist Payload/QuickToggle.app/Info.plist
          cp Resources/*.png Payload/QuickToggle.app/
          rm -rf Payload/QuickToggle.app/*.dSYM
          
          zip -qr9 QuickToggle.ipa Payload/
          mkdir -p output
          mv QuickToggle.ipa output/
          ls -la output/

      - name: Create GitHub Release v1.0.2
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.2
          name: "QuickToggle v1.0.2 - Đầy Đủ Icon & Giao Diện 1 Chạm"
          body: |
            ## ⚡ QuickToggle v1.0.2
            - Bổ sung trọn bộ AppIcon Retina 3D và Info.plist chuẩn.
            - Điều khiển Wi-Fi & 3G/4G trực tiếp từ màn hình chính cho iPhone của Sếp.
          files: output/*.ipa
